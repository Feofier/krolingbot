<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="round"><rect width="512" height="512" rx="110"/></clipPath>
    <radialGradient id="g" cx="0.35" cy="0.28" r="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="#58cc02"/>
    <rect width="512" height="512" fill="url(#g)"/>

    <!-- тень: сжимается, когда кенгуру в воздухе -->
    <ellipse cx="256" cy="462" rx="160" ry="20" fill="#3d8c01" opacity="0.55">
      <animate attributeName="rx" values="160;110;160" keyTimes="0;0.45;1"
               calcMode="spline" keySplines="0.3 0 0.6 1;0.3 0 0.6 1"
               dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0.3;0.55" keyTimes="0;0.45;1"
               dur="1.2s" repeatCount="indefinite"/>
    </ellipse>

    <!-- ПРЫЖОК: весь кенгуру подпрыгивает -->
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -64; 0 0" keyTimes="0;0.45;1"
        calcMode="spline" keySplines="0.35 0 0.25 1;0.35 0 0.25 1"
        dur="1.2s" repeatCount="indefinite"/>

      <!-- SQUASH & STRETCH вокруг лап -->
      <g>
        <animateTransform attributeName="transform" type="scale" additive="sum"
          values="1 1;0.94 1.08;1.06 0.9;1 1;1 1" keyTimes="0;0.12;0.28;0.45;1"
          calcMode="spline"
          keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.3 0 0.3 1;0 0 1 1"
          dur="1.2s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" additive="sum"
          values="0 0;0 -18;0 10;0 0;0 0" keyTimes="0;0.12;0.28;0.45;1"
          dur="1.2s" repeatCount="indefinite"/>
        <g transform="translate(256 440)">
          <g>
            <animateTransform attributeName="transform" type="translate"
              values="-256 -440" dur="1s" repeatCount="1"/>
            <g transform="translate(-256 -440)">

    <!-- хвост за телом: отставание при прыжке -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="0 150 340; -10 150 340; 6 150 340; 0 150 340" keyTimes="0;0.35;0.6;1"
        calcMode="spline" keySplines="0.3 0 0.6 1;0.3 0 0.6 1;0.3 0 0.6 1"
        dur="1.2s" repeatCount="indefinite"/>
      <path d="M 150 330 Q 70 340 82 430 Q 120 452 172 420 Z" fill="#8a4c24"/>
    </g>

    <!-- уши: подпрыгивают с задержкой -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="0 208 150; -10 208 150; 4 208 150; 0 208 150; 0 208 150" keyTimes="0;0.3;0.5;0.7;1"
        calcMode="spline" keySplines="0.3 0 0.6 1;0.3 0 0.6 1;0.3 0 0.6 1;0 0 1 1"
        dur="1.2s" repeatCount="indefinite"/>
      <g transform="rotate(-18 208 128)">
        <ellipse cx="208" cy="124" rx="30" ry="62" fill="#a05a2c"/>
        <ellipse cx="208" cy="132" rx="14" ry="40" fill="#e8b58a"/>
      </g>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="0 304 150; 10 304 150; -4 304 150; 0 304 150; 0 304 150" keyTimes="0;0.34;0.54;0.74;1"
        calcMode="spline" keySplines="0.3 0 0.6 1;0.3 0 0.6 1;0.3 0 0.6 1;0 0 1 1"
        dur="1.2s" repeatCount="indefinite"/>
      <g transform="rotate(18 304 128)">
        <ellipse cx="304" cy="124" rx="30" ry="62" fill="#a05a2c"/>
        <ellipse cx="304" cy="132" rx="14" ry="40" fill="#e8b58a"/>
      </g>
    </g>

    <!-- задние лапы -->
    <ellipse cx="150" cy="428" rx="62" ry="30" fill="#8a4c24"/>
    <ellipse cx="362" cy="428" rx="62" ry="30" fill="#8a4c24"/>

    <!-- тело -->
    <ellipse cx="256" cy="330" rx="118" ry="128" fill="#a05a2c"/>
    <ellipse cx="256" cy="372" rx="74" ry="82" fill="#e8b58a"/>

    <!-- сумка -->
    <path d="M 204 416 Q 256 452 308 416 Q 300 440 256 444 Q 212 440 204 416 Z" fill="#8a4c24"/>

    <!-- передние лапки: машут в воздухе -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="0 214 350; -25 214 350; 10 214 350; 0 214 350" keyTimes="0;0.4;0.65;1"
        calcMode="spline" keySplines="0.3 0 0.6 1;0.3 0 0.6 1;0.3 0 0.6 1"
        dur="1.2s" repeatCount="indefinite"/>
      <ellipse cx="214" cy="330" rx="18" ry="32" fill="#8a4c24" transform="rotate(20 214 330)"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="0 298 350; 25 298 350; -10 298 350; 0 298 350" keyTimes="0;0.44;0.69;1"
        calcMode="spline" keySplines="0.3 0 0.6 1;0.3 0 0.6 1;0.3 0 0.6 1"
        dur="1.2s" repeatCount="indefinite"/>
      <ellipse cx="298" cy="330" rx="18" ry="32" fill="#8a4c24" transform="rotate(-20 298 330)"/>
    </g>

    <!-- голова -->
    <ellipse cx="256" cy="226" rx="98" ry="88" fill="#a05a2c"/>
    <ellipse cx="256" cy="252" rx="72" ry="56" fill="#c9803e"/>

    <!-- ноздри -->
    <ellipse cx="240" cy="238" rx="8" ry="11" fill="#5f3312"/>
    <ellipse cx="272" cy="238" rx="8" ry="11" fill="#5f3312"/>

    <!-- глаза-прищуры (счастливые): гаснут на мгновение моргания -->
    <g>
      <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.8;0.83;0.87;0.9;1"
               dur="2.6s" repeatCount="indefinite"/>
      <path d="M 186 208 Q 212 184 238 208" stroke="#3b230f" stroke-width="11" fill="none" stroke-linecap="round"/>
      <path d="M 274 208 Q 300 184 326 208" stroke="#3b230f" stroke-width="11" fill="none" stroke-linecap="round"/>
    </g>
    <!-- закрытые глаза при моргании -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8;0.83;0.87;0.9;1"
               dur="2.6s" repeatCount="indefinite"/>
      <path d="M 188 202 L 236 202" stroke="#3b230f" stroke-width="11" fill="none" stroke-linecap="round"/>
      <path d="M 276 202 L 324 202" stroke="#3b230f" stroke-width="11" fill="none" stroke-linecap="round"/>
    </g>

    <!-- брови -->
    <path d="M 182 152 Q 210 136 240 150" stroke="#5f3312" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M 272 150 Q 302 136 330 152" stroke="#5f3312" stroke-width="9" fill="none" stroke-linecap="round"/>

    <!-- широкая улыбка -->
    <path d="M 216 278 Q 256 318 296 278 Z" fill="#5f3312"/>
    <path d="M 232 296 Q 256 310 280 296 Q 256 322 232 296 Z" fill="#ff8fa3"/>

            </g>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
